name: MoonPressure checks
on: [push, pull_request, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Validate core, APIs and replay
        run: |
          moon version --all
          moon fmt --check
          moon check --target wasm-gc --deny-warn --warn-list +73
          moon test --target wasm --deny-warn
          moon test --target wasm-gc --deny-warn
          moon test --target js --deny-warn
          python3 scripts/verify_replay.py wasm wasm-gc js
          python3 scripts/verify_admission.py wasm wasm-gc js
      - name: Validate Linux collector and oracle
        run: |
          moon check --target native --deny-warn
          moon test --target native --deny-warn
          moon build --target native --release --deny-warn
          python3 scripts/verify_replay.py native
          python3 scripts/verify_admission.py native
          python3 scripts/verify_linux.py
      - name: Validate live observation to admission ledger
        run: |
          group=$(awk -F: '$1=="0" {print substr($3,2)}' /proc/self/cgroup)
          moon run examples/admission-live --target native -- /sys/fs/cgroup "$group" > demo-output/admission-live.json
          python3 -c 'import json; d=json.load(open("demo-output/admission-live.json")); assert d["real_linux_collection"] and d["stale_plan_rejected"] and d["released_all"] and d["processes_started"] == 0; print("Live collection to logical admission ledger passed")'
      - name: Validate actual package consumer
        run: python3 scripts/verify_package.py
      - name: Validate dispatcher model, real children and planning comparison
        run: |
          python3 scripts/verify_dispatch.py
          python3 scripts/verify_execution.py
          python3 scripts/verify_benchmark.py
      - name: Validate exact registry version when released
        run: |
          python3 - <<'PY'
          import json, pathlib, re, subprocess, urllib.request
          version = re.search(r'^version\s*=\s*"([^"]+)"', pathlib.Path('moon.mod').read_text(), re.M)[1]
          with urllib.request.urlopen('https://mooncakes.io/api-new/v0/manifest/trail-it/moonpressure', timeout=30) as response:
              versions = [v['version'] for v in json.load(response)['versions']]
          if version in versions:
              subprocess.run(['python3', 'scripts/verify_package.py', '--registry-version', version], check=True)
          else:
              print('Current development version not published; registry consumption deferred')
          PY
      - name: Save sanitized validation summaries
        uses: actions/upload-artifact@v4
        with:
          name: verification-summary
          retention-days: 7
          path: |
            demo-output/consumer-registry.json
            demo-output/admission-summary.json
            demo-output/admission-live.json
            demo-output/dispatch-model-summary.json
            demo-output/execution-summary.json
            demo-output/benchmark-summary.json
